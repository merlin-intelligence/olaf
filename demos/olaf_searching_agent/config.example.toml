# olaf_searching_agent — example configuration
# Copy to config.toml and fill in your values.

[olaf]
# URL of the running OLAF MCP server (SSE endpoint)
url = "http://localhost:8000/sse"

# Ontology to search (must already exist — build it with olaf_building_agent)
ontology_id = "demo"

# Qdrant collection the ontology was built from, used to read source chunks
# (default: the server's [qdrant].collection)
collection = "chunks"

# Optional — payload field names, if this collection differs from the server's [qdrant.field_mapping]
# [olaf.field_mapping]
# text        = "text"
# doc_id      = "doc_id"
# chunk_index = "chunk_index"


[litellm]
# Any model supported by LiteLLM — change the string to switch providers:
#   Anthropic : "claude-sonnet-4-6"  → set ANTHROPIC_API_KEY
#   OpenAI    : "gpt-4o"             → set OPENAI_API_KEY
#   Azure     : "azure/gpt-4o"       → set AZURE_API_KEY, AZURE_API_BASE
#   Ollama    : "ollama/llama3"       → no key needed, set OLLAMA_API_BASE if non-default
#   Scaleway  : "openai/<model>"      → OpenAI-compatible: set api_base + api_key_env below
# Writing correct SPARQL benefits from a strong model.
model       = "claude-sonnet-4-6"
max_tokens  = 4096
temperature = 0

# Seconds per LLM call before giving up. Raise this for reasoning models (e.g. ones that
# "think" before answering) which can take a while to produce a large max_tokens response.
timeout = 120

# Retries when the provider answers 429 (rate limit / tokens-per-minute quota),
# waiting 15s, 30s, then 60s between attempts.
rate_limit_retries = 6

# Retries when a call times out, cannot connect, or gets a 5xx error (10s pause each).
transient_retries = 2

# Optional — custom endpoint for OpenAI-compatible providers (Scaleway, vLLM…).
# api_key_env is the NAME of the env var holding the key (the key itself stays out of the file).
# Example for Scaleway Generative APIs:
#   model       = "openai/llama-3.3-70b-instruct"
#   api_base    = "https://api.scaleway.ai/v1"
#   api_key_env = "SCW_SECRET_KEY"
# api_base    = ""
# api_key_env = ""


[agent]
# Maximum number of LLM ↔ tool rounds per question. When reached, the agent is asked
# to answer with the evidence gathered so far.
max_iterations = 20

# Tool results longer than this are truncated before being sent to the LLM
# (keeps large SPARQL results or exports from blowing up the context).
max_tool_result_chars = 20000

# Tool results older than the last `keep_recent_turns` LLM turns (e.g. from previous
# questions) are cut to a `pruned_result_chars` preview to keep the context small.
keep_recent_turns   = 4
pruned_result_chars = 500

# Print every SPARQL query generated by the agent (to stderr). Overridable with --show-sparql.
show_sparql = true

# Log verbosity: DEBUG | INFO | WARNING
log_level = "INFO"
