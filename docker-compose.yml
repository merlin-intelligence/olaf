services:
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: --location /data --bind 0.0.0.0:7878
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    restart: unless-stopped

  olaf:
    build: .
    ports:
      - "8000:8000"
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      - oxigraph
    restart: unless-stopped

volumes:
  oxigraph_data:
