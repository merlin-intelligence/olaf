services:
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: serve --location /data --bind 0.0.0.0:7878
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    restart: unless-stopped

  olaf:
    build: .
    # Host networking: lets this container reach services bound to the host's
    # 127.0.0.1 (e.g. a Qdrant instance listening only on loopback) — `ports` and
    # `extra_hosts` are then ignored/unneeded. Requires config.toml to use
    # localhost instead of service names (e.g. [oxigraph].url = "http://localhost:7878").
    network_mode: host
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - olaf_models:/models            # embedding model cache (downloaded once)
    depends_on:
      - oxigraph
    restart: unless-stopped

volumes:
  oxigraph_data:
  olaf_models:
